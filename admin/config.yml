backend:
  name: github
  repo: pongsun-b/TravBhv
  branch: main

site_url: https://pongsun-b.github.io/TravBhv
display_url: https://pongsun-b.github.io/TravBhv
logo_url: https://pongsun-b.github.io/TravBhv/favicon.ico

publish_mode: simple
locale: en

media_folder: images/teampic
public_folder: /images/teampic

collections:
  - name: site_content
    label: Site content
    files:
      - name: faculty
        label: Faculty
        file: _data/team_members.yml
        fields:
          - name: items
            label: Faculty members
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: info, widget: string, required: false, hint: "e.g. Assistant Professor" }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false, media_folder: images/teampic, public_folder: "", choose_url: false }
              - { label: Bio, name: bio, widget: text, required: false }
      - name: students
        label: Students
        file: _data/students.yml
        fields:
          - name: items
            label: Students
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: info, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
      - name: publications
        label: Publications
        file: _data/publist.yml
        fields:
          - name: items
            label: Papers
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Theme, name: theme, widget: select, options: ["Transport", "Environment and food", "Economy"], required: false }
              - { label: Authors, name: authors, widget: string, hint: "e.g. Bunditsakulchai P., Liu C." }
              - { label: Short description, name: description, widget: text, required: false }
              - label: Link
                name: link
                widget: object
                fields:
                  - { label: URL, name: url, widget: string, hint: "DOI or paper link" }
                  - { label: Link text, name: display, widget: string, hint: "e.g. DOI: 10.1234/..." }
      - name: news
        label: News
        file: _data/news.yml
        fields:
          - name: items
            label: News items
            widget: list
            summary: "{{fields.date}} — {{fields.headline}}"
            fields:
              - { label: Date, name: date, widget: string, hint: "e.g. 31 Aug 2026" }
              - { label: Headline, name: headline, widget: text }
      - name: extras
        label: Extra pages
        file: _data/extras.yml
        fields:
          - name: items
            label: Extra pages and dashboards
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string, hint: "Menu label, e.g. PTAI" }
              - { label: URL, name: url, widget: string, hint: "On this site: /foo/ — elsewhere: https://…" }
              - { label: Show in top menu, name: nav, widget: boolean, default: true }
              - { label: Show in footer, name: footer, widget: boolean, default: false }
              - { label: Short description, name: description, widget: text, required: false, hint: "Shown on the Apps page" }
  - name: blog
    label: Blog posts
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }
