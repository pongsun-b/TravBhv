name: Deploy Jekyll site to Pages (legacy - manual only)

# LEGACY. The published site is now the TBRG site in site/, deployed by .github/workflows/pages.yml.
# This workflow is kept for reference and for anyone who still wants to build the old Jekyll pages,
# but its push trigger was removed so that two workflows can no longer race for the same Pages
# environment. Run it from the Actions tab with "Run workflow" if you ever need it.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
