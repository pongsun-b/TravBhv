<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2E6B57" />
    <meta
      name="description"
      content="TBRG, the Travel Behavior Research Group, studies how people move through Bangkok and what those choices mean for transport systems, planning, and policy."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TBRG" />
    <meta property="og:title" content="TBRG · Travel Behavior Research Group" />
    <meta
      property="og:description"
      content="How a city moves, one decision at a time. Research on travel behavior, walk access to urban rail, and transport planning in Bangkok."
    />
    <meta property="og:image" content="%sveltekit.assets%/media/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%sveltekit.assets%/media/og-image.png" />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('tbrg-theme');
          var mode =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          /* keep the light default */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
